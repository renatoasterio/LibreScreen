name: Bug report
description: Something in LibreScreen does not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please do not attach recordings or screenshots that show personal
        data. Security problems are reported privately instead: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead.
      placeholder: |
        1. Chose Record › Area and selected a region on the second display
        2. Pressed Record and stopped after 10 seconds
        Expected: a video of the selected region
        Actual: the video shows the main display
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording (full screen, window or area)
        - Webcam bubble or virtual background
        - Audio (system or microphone)
        - Screenshots
        - Annotation editor
        - Shortcuts, menu bar or settings
        - Permissions
        - Building or installing
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LibreScreen version
      description: Settings › About, or the commit you built from.
      placeholder: "0.1.0 (commit f5749e7)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and displays
      placeholder: "MacBook Pro 14-inch (M3 Pro), built-in display + external 4K"
    validations:
      required: true
  - type: checkboxes
    id: setup
    attributes:
      label: What was turned on?
      options:
        - label: Camera
        - label: Microphone
        - label: System audio
        - label: More than one display connected
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: |
        Open Console.app, start streaming, type `subsystem:br.com.asoft.LibreScreen` in the search field and reproduce
        the problem. Paths, window titles and device names are redacted by the app.
      render: text
