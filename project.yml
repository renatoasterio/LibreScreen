# LibreScreen — XcodeGen project definition (source of truth; run `xcodegen generate`).
name: LibreScreen

options:
  bundleIdPrefix: br.com.asoft
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.5"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  indentWidth: 4
  tabWidth: 4
  usesTabs: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
      DEBUG_INFORMATION_FORMAT: dwarf
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  LibreScreen:
    type: application
    platform: macOS
    sources:
      - path: LibreScreen
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: LibreScreen
        PRODUCT_BUNDLE_IDENTIFIER: br.com.asoft.LibreScreen
        INFOPLIST_FILE: LibreScreen/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: LibreScreen/Resources/LibreScreen.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    postCompileScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          export PATH="/opt/homebrew/bin:$PATH"
          if command -v swiftlint >/dev/null 2>&1; then
            cd "${SRCROOT}" && swiftlint lint --quiet --config "${SRCROOT}/.swiftlint.yml"
          else
            echo "warning: SwiftLint is not installed (brew install swiftlint)"
          fi
    scheme:
      testTargets:
        - LibreScreenTests
      gatherCoverageData: true
      coverageTargets:
        - LibreScreen

  LibreScreenTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LibreScreenTests
    dependencies:
      - target: LibreScreen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.asoft.LibreScreenTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
